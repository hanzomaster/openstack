---
###############################################################################
# globals.yml — Kolla-Ansible configuration overrides for multi-node prod.
#
# WHAT IS THIS FILE?
#   Kolla-Ansible has a master config at /etc/kolla/globals.yml on the
#   bastion (or wherever you run kolla-ansible from). That file has hundreds
#   of settings with defaults. This file contains ONLY the values we need
#   to override for our specific cluster.
#
# HOW IT'S USED:
#   The deploy script (02-deploy-openstack.sh) appends these overrides to
#   the bottom of /etc/kolla/globals.yml. Values defined later in the file
#   override earlier ones, so our settings take precedence.
#
# WHEN TO EDIT THIS FILE:
#   - If you change IPs in aws/terraform/variables.tf or azure/terraform/variables.tf,
#     update them here too
#   - If you want to enable/disable OpenStack services
#   - If you change instance types or networking
#   - On Azure, replace ens5/ens6 below with eth0/eth1 (Azure NIC naming)
###############################################################################


# =============================================================================
# Base image settings
# =============================================================================

# Which Linux distro the Kolla Docker images are based on.
# Options: "ubuntu", "centos", "rocky", "debian"
# Ubuntu images are well-tested and match our host OS.
kolla_base_distro: "ubuntu"

# Which OpenStack release to deploy. "2025.2" is codename "Flamingo".
# Pinning to a specific release ensures reproducibility.
# See: https://releases.openstack.org/
openstack_release: "2025.2"


# =============================================================================
# Networking
# =============================================================================

# INTERNAL VIP (Virtual IP Address)
# ---------------------------------
# HAProxy binds to this IP. ALL OpenStack API endpoints (Keystone, Nova,
# Glance, Neutron, etc.) are served through this single IP.
#
# This must be an unused IP in the same subnet as the management network.
# We assigned it as a secondary IP on the controller's primary ENI in
# Terraform (main.tf, aws_network_interface.controller_mgmt).
#
# If you later add a second controller for HA, keepalived will float this
# VIP between the two controllers automatically.
kolla_internal_vip_address: "10.0.2.250"

# NETWORK INTERFACE (management / API traffic)
# ---------------------------------------------
# The network interface used for internal OpenStack traffic on ALL nodes.
# On Ubuntu EC2 instances, the primary ENI always shows up as "ens5".
# This carries: API calls, database replication, RabbitMQ messages,
# inter-service communication, tenant VXLAN tunnels, etc.
network_interface: "eth0"

# API INTERFACE ADDRESS — pin services to the management IP, not the VIP.
# ----------------------------------------------------------------------
# Kolla normally derives api_interface_address from ansible_facts (the
# "primary" IP on network_interface). On AWS, keepalived adds the VIP
# (10.0.2.250) to ens5 as a non-secondary address, which bumps the
# kernel-reported primary IP from 10.0.2.10 → 10.0.2.250. As a result,
# MariaDB tries to bind 10.0.2.250:3306 — exactly where ProxySQL already
# listens — and crashes with "Address already in use".
#
# Setting api_interface_address explicitly anchors per-host services
# (MariaDB, RabbitMQ, internal APIs) to the controller's management IP,
# leaving the VIP free for ProxySQL/HAProxy.
api_interface_address: "10.0.2.10"

# NEUTRON EXTERNAL INTERFACE
# --------------------------
# The network interface Neutron uses for external/provider networks.
# This is the second ENI attached to the controller (device_index=1),
# which Ubuntu names "ens6".
# Neutron's L3 agent creates a bridge (br-ex) and plugs this interface
# into it for floating IP and provider network traffic.
neutron_external_interface: "eth1"


# =============================================================================
# Virtualization
# =============================================================================

# EC2 non-metal instances don't expose hardware virtualization (KVM).
# We must use QEMU (software emulation) instead. This is MUCH slower —
# VM boots take minutes instead of seconds — but works for a lab/staging
# environment. For real production, use bare-metal instances (e.g., m5.metal)
# or on-premise servers with KVM support.
nova_compute_virt_type: "qemu"


# =============================================================================
# Enabled services
# =============================================================================

# Horizon — the OpenStack web dashboard. Access it via SSH tunnel:
#   ssh -L 8080:<VIP>:80 ubuntu@<bastion-public-ip>
#   Then open http://localhost:8080
enable_horizon: "yes"

# Neutron provider networks — allows creating networks that map directly
# to the physical (or in our case, virtual) network infrastructure.
enable_neutron_provider_networks: "yes"

# Cinder — OpenStack block storage. Provides virtual disks (volumes)
# that can be attached to VMs. We use LVM as the backend.
enable_cinder: "yes"

# Cinder LVM backend — uses Linux LVM (Logical Volume Manager) on a
# dedicated disk to carve out block storage volumes. The disk is the
# extra EBS volume attached to each compute node.
enable_cinder_backend_lvm: "yes"

# The LVM volume group name that Cinder manages. Our deploy script
# creates this VG on the extra EBS volume of each compute node.
cinder_volume_group: "cinder-volumes"

# Cinder cluster name — required when more than one cinder-volume runs.
# We have two storage nodes (compute-1, compute-2 in the [storage] group),
# so the cinder-volume processes need a shared cluster identity to coordinate
# (claiming volumes, avoiding split-brain). Any non-empty string works; the
# value just labels them as peers in the same logical cluster.
# See: https://docs.openstack.org/kolla-ansible/latest/reference/storage/cinder-guide.html#ha
cinder_cluster_name: "prod-cluster"


# =============================================================================
# Disabled services (keep footprint small)
# =============================================================================

# Ceph — distributed storage. Overkill for our setup, and requires
# minimum 3 nodes with dedicated disks. We use simple LVM instead.
enable_ceph: "no"

# Swift — object storage (like S3). Not needed for this cluster.
enable_swift: "no"

# Heat — orchestration (like CloudFormation). Enable if you need
# stack templates / auto-scaling.
enable_heat: "no"
