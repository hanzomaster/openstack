---
# Overrides appended to /etc/kolla/globals.yml by scripts/30-deploy-kolla.sh.
# Only override what differs from Kolla-Ansible's shipped defaults.
#
# Values tuned for:
#   instance:     m5.2xlarge (no nested virt) in ap-southeast-1b
#   primary NIC:  ens5 (172.31.38.210/20 in default VPC 172.31.0.0/16)
#   ext NIC:      veth-ext (Option B stand-in, no ens6 attached)
#   storage:      loopback-VG cinder-volumes (Option B)
# See lab/docs/01-current-state.md for the snapshot these values come from.

kolla_base_distro: "ubuntu"
openstack_release: "2025.1"          # Epoxy — pin to a specific release for reproducibility

# VIP must live in the same /20 as ens5 (172.31.32.0/20). We chose .38.250
# because it's near our primary .38.210 and sits outside the AWS-reserved
# .0-.3 / .255 range. Confirm it is free before first deploy:
#   ping -c1 172.31.38.250   # must time out
kolla_internal_vip_address: "172.31.38.250"

# Interfaces as they appear in `ip -br link` on this host.
network_interface: "ens5"
neutron_external_interface: "veth-ext"

# EC2 non-metal instances don't expose nested KVM, so force qemu.
# Expect slow VM boots (minutes). Acceptable for lab.
nova_compute_virt_type: "qemu"

# Services we need for the tickets
enable_horizon: "yes"
enable_neutron_provider_networks: "yes"
enable_cinder: "yes"
enable_cinder_backend_lvm: "yes"
cinder_volume_group: "cinder-volumes"

# Services we explicitly don't want — keep the footprint small
enable_ceph: "no"
enable_swift: "no"
enable_heat: "no"            # flip to yes if a ticket needs orchestration
